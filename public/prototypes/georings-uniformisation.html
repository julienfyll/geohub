<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniformisation GeoRings & BlindPoint | GeoHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 overflow-hidden w-screen h-screen relative select-none">

  <!-- Interactive Map with Concentric Rings -->
  <div id="map" class="absolute inset-0 z-0 bg-slate-950"></div>

  <!-- BOTTOM CONTROL BAR: Switch between GeoRings Variants & Compare with BlindPoint -->
  <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-slate-700/80 backdrop-blur-xl p-2.5 rounded-2xl shadow-2xl flex flex-wrap items-center justify-center gap-2.5 text-xs">
    <span class="text-slate-400 font-bold px-2 flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
      <span>Variantes GeoRings :</span>
    </span>

    <button 
      id="tab-var1"
      onclick="setVariant(1)"
      class="px-3.5 py-1.5 rounded-xl bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30 transition-all flex items-center gap-1.5"
    >
      <span>Variante A : Dropdown Unifié (Miroir BlindPoint)</span>
    </button>

    <button 
      id="tab-var2"
      onclick="setVariant(2)"
      class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all flex items-center gap-1.5"
    >
      <span>Variante B : Métrique en Pill Directe</span>
    </button>

    <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>

    <a 
      href="/play/blindpoint" 
      target="_blank"
      class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold transition-all flex items-center gap-1"
      title="Ouvrir Blind Point dans un autre onglet pour comparer"
    >
      <span>🎯 Voir BlindPoint</span>
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
    </a>

    <a 
      href="index.html" 
      class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition-all"
    >
      📋 Lab Prototypes
    </a>
  </div>

  <!-- =================================================================== -->
  <!-- TOP HEADER : UNIFORMISÉ AVEC LE NOUVEAU DESIGN BLINDPOINT           -->
  <!-- =================================================================== -->
  <header class="absolute top-0 left-0 right-0 z-40 flex items-center justify-between px-3 sm:px-5 h-14 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/80 shadow-md">
    
    <!-- GAUCHE : Identité de jeu & Sortie (Exactement identique à BlindPoint) -->
    <div class="flex items-center gap-2.5">
      <button class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/60 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <a href="/" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/60 text-xs font-semibold transition-all">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Hub</span>
      </a>

      <div class="flex items-center gap-2 pl-1">
        <div class="w-6 h-6 rounded-lg bg-blue-500/15 border border-blue-500/30 flex items-center justify-center text-blue-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><circle cx="12" cy="12" r="6" stroke-width="2"/><circle cx="12" cy="12" r="2" stroke-width="2"/></svg>
        </div>
        <h1 class="text-sm font-bold tracking-tight text-white hidden md:block">
          GeoRings
        </h1>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- CENTRE : LE BLOC UNIFORMISÉ (SWITCHER DE MODES + DROPDOWNS)       -->
    <!-- ================================================================= -->
    <div class="flex items-center gap-2 sm:gap-3">
      
      <!-- 1. Mode Switcher (1-Clic direct : Du Jour | Rapide | Custom) -->
      <div class="flex items-center gap-0.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs font-medium shadow-sm">
        <button 
          id="mode-daily"
          onclick="setMode('daily')" 
          class="px-2.5 py-1 rounded-lg font-bold bg-blue-600 text-white shadow-sm transition-all flex items-center gap-1"
          title="Défi officiel du jour"
        >
          <span>📅 Du Jour</span>
        </button>

        <button 
          id="mode-free"
          onclick="setMode('free')" 
          class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1 font-medium hover:bg-slate-800"
          title="Partie rapide standard"
        >
          <span>⚡ Rapide</span>
        </button>

        <button 
          id="mode-custom"
          onclick="setMode('custom')" 
          class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1 font-medium hover:bg-slate-800"
          title="Personnaliser rayons, anneaux et vies"
        >
          <span>⚙️ Custom</span>
        </button>
      </div>

      <!-- ============================================================= -->
      <!-- VARIANTE A : DROPDOWN UNIFIÉ (TERRITOIRE + MÉTRIQUE)           -->
      <!-- Comme dans BlindPoint où le dropdown gère Packs + Difficulté! -->
      <!-- ============================================================= -->
      <div id="var1-container" class="relative">
        <button 
          id="var1-btn"
          onclick="toggleVar1Dropdown()" 
          class="group flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800/90 border border-slate-700/80 hover:border-slate-600 text-xs transition-all shadow-sm cursor-pointer"
          title="Changer d'échelle géographique ou de métrique"
        >
          <span id="var1-flag">🇫🇷</span>
          <span class="font-bold text-white group-hover:text-blue-300 transition-colors" id="var1-label">
            France • Villes
          </span>
          <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-white group-hover:translate-y-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <!-- Dropdown Menu Variante A -->
        <div 
          id="var1-menu"
          class="hidden absolute top-full left-1/2 -translate-x-1/2 sm:left-0 sm:translate-x-0 mt-2 w-72 bg-slate-900/95 border border-slate-700/90 rounded-2xl p-2.5 shadow-2xl backdrop-blur-2xl z-50 flex flex-col gap-2.5 animate-in fade-in duration-150 text-left"
        >
          <!-- Section 1 : Territoire / Échelle -->
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 block mb-1">
              🌍 Échelle Géographique
            </span>
            <div class="space-y-1">
              <button onclick="pickVar1Scale('🇫🇷', 'France')" class="v1-scale-opt w-full flex items-center justify-between p-2 rounded-xl bg-blue-600/15 border border-blue-500/40 text-left transition-all">
                <div class="flex items-center gap-2">
                  <span class="text-base">🇫🇷</span>
                  <div>
                    <p class="text-xs font-bold text-white leading-tight">France</p>
                    <p class="text-[10px] text-slate-400 leading-tight">Communes métropolitaines</p>
                  </div>
                </div>
                <span class="text-xs text-blue-400 font-bold check">✓</span>
              </button>

              <button onclick="pickVar1Scale('🇪🇺', 'Europe')" class="v1-scale-opt w-full flex items-center justify-between p-2 rounded-xl bg-slate-950/40 border border-slate-800 text-left transition-all hover:bg-slate-800/60">
                <div class="flex items-center gap-2">
                  <span class="text-base">🇪🇺</span>
                  <div>
                    <p class="text-xs font-bold text-white leading-tight">Europe</p>
                    <p class="text-[10px] text-slate-400 leading-tight">Grandes agglomérations européennes</p>
                  </div>
                </div>
                <span class="text-xs text-blue-400 font-bold hidden check">✓</span>
              </button>

              <button onclick="pickVar1Scale('🌍', 'Monde')" class="v1-scale-opt w-full flex items-center justify-between p-2 rounded-xl bg-slate-950/40 border border-slate-800 text-left transition-all hover:bg-slate-800/60">
                <div class="flex items-center gap-2">
                  <span class="text-base">🌍</span>
                  <div>
                    <p class="text-xs font-bold text-white leading-tight">Monde</p>
                    <p class="text-[10px] text-slate-400 leading-tight">Métropoles mondiales des 6 continents</p>
                  </div>
                </div>
                <span class="text-xs text-blue-400 font-bold hidden check">✓</span>
              </button>
            </div>
          </div>

          <!-- Section 2 : Métrique (Villes vs Aéroports) -->
          <div class="border-t border-slate-800 pt-2">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 px-2 block mb-1">
              📊 Données cibles
            </span>
            <div class="grid grid-cols-2 gap-1.5">
              <button onclick="pickVar1Metric('population', 'Villes', '👥')" id="v1-metric-pop" class="py-2 px-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-blue-600 border-blue-500 text-white shadow-sm">
                <span>👥 Villes</span>
              </button>
              <button onclick="pickVar1Metric('airports', 'Aéroports', '✈️')" id="v1-metric-air" class="py-2 px-2.5 rounded-xl border text-xs font-medium transition-all flex items-center justify-center gap-1.5 bg-slate-950/40 border-slate-800 text-slate-400 hover:text-slate-200">
                <span>✈️ Aéroports</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ============================================================= -->
      <!-- VARIANTE B : 2 PILLS SÉPARÉES (TERRITOIRE DROPDOWN + MÉTRIQUE) -->
      <!-- ============================================================= -->
      <div id="var2-container" class="hidden items-center gap-2 sm:gap-2.5">
        <!-- Territoire Dropdown -->
        <div class="relative" id="var2-scale-dropdown-container">
          <button 
            onclick="toggleVar2Dropdown()" 
            class="group flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800/90 border border-slate-700/80 hover:border-slate-600 text-xs transition-all shadow-sm cursor-pointer"
          >
            <span id="var2-flag">🇫🇷</span>
            <span class="font-bold text-white group-hover:text-blue-300 transition-colors" id="var2-label">France</span>
            <svg class="w-3.5 h-3.5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>

          <div 
            id="var2-menu"
            class="hidden absolute top-full left-0 mt-2 w-48 bg-slate-900/95 border border-slate-700/90 rounded-2xl p-1.5 shadow-2xl backdrop-blur-2xl z-50 flex flex-col gap-1 text-left"
          >
            <button onclick="pickVar2Scale('🇫🇷', 'France')" class="w-full flex items-center justify-between p-2 rounded-xl bg-blue-600/15 text-blue-300 text-xs font-bold">
              <span>🇫🇷 France</span>
              <span>✓</span>
            </button>
            <button onclick="pickVar2Scale('🇪🇺', 'Europe')" class="w-full flex items-center justify-between p-2 rounded-xl text-slate-300 hover:bg-slate-800 text-xs font-medium">
              <span>🇪🇺 Europe</span>
            </button>
            <button onclick="pickVar2Scale('🌍', 'Monde')" class="w-full flex items-center justify-between p-2 rounded-xl text-slate-300 hover:bg-slate-800 text-xs font-medium">
              <span>🌍 Monde</span>
            </button>
          </div>
        </div>

        <!-- Metric Switcher Direct (2 onglets) -->
        <div class="flex items-center gap-0.5 bg-slate-900/90 p-1 rounded-xl border border-slate-800 text-xs font-medium shadow-sm">
          <button onclick="setVar2Metric('pop')" id="var2-metric-pop" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold transition-all flex items-center gap-1 shadow-sm">
            <span>👥 Villes</span>
          </button>
          <button onclick="setVar2Metric('air')" id="var2-metric-air" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition-all flex items-center gap-1 hover:bg-slate-800">
            <span>✈️ Aéroports</span>
          </button>
        </div>
      </div>

    </div>

    <!-- ================================================================= -->
    <!-- DROITE : TÉLÉMÉTRIE DE JEU & ACTIONS                              -->
    <!-- ================================================================= -->
    <div class="flex items-center gap-2">
      <!-- Vies / Cœurs -->
      <div class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-xs font-bold shadow-sm">
        <span class="text-rose-500 animate-pulse text-sm">❤️</span>
        <span class="text-rose-500 text-sm">❤️</span>
        <span class="text-rose-500 text-sm">❤️</span>
      </div>

      <!-- Anneaux restants -->
      <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-xs font-semibold text-slate-300 font-mono">
        <span class="text-slate-400 font-normal hidden sm:inline">Anneau</span>
        <span class="text-blue-400 font-bold">1/5</span>
      </div>

      <!-- Score actuel -->
      <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900/90 border border-blue-500/40 text-xs font-bold text-white shadow-sm font-mono">
        <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
        <span>1 240 500 hab</span>
      </div>

      <!-- Bouton Paramètres (⚙️) -->
      <button class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white border border-slate-700/80 transition-all text-xs" title="Paramètres">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>

      <!-- Avatar Utilisateur -->
      <button class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 border border-blue-400/40 flex items-center justify-center font-bold text-xs text-white shadow-sm">
        JF
      </button>
    </div>
  </header>

  <!-- GEORINGS FLOATING TOP CONTROL BAR (La barre de recherche & rayon à top-20) -->
  <div class="absolute top-20 left-1/2 -translate-x-1/2 z-30 w-full max-w-xl sm:max-w-2xl px-4 pointer-events-none">
    <div class="pointer-events-auto bg-slate-950/95 border border-slate-800/90 rounded-2xl p-2.5 shadow-2xl backdrop-blur-xl flex flex-col gap-2">
      <div class="flex items-center gap-2">
        <!-- Target Radius Badge -->
        <div class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-blue-600/15 border border-blue-500/30 text-blue-300 font-semibold text-xs shrink-0 whitespace-nowrap shadow-sm">
          <svg class="w-3.5 h-3.5 text-blue-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span id="radius-indicator">&lt; 150 km</span>
        </div>

        <!-- Search Bar Input -->
        <div class="flex-1 relative">
          <input 
            type="text" 
            placeholder="Tapez la commune la plus peuplée dans cet anneau..." 
            class="w-full bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
          />
        </div>

        <!-- Skip Button -->
        <button class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 hover:text-white transition-all shrink-0">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
          <span class="hidden sm:inline">Passer</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Vertical Ring HUD on Right Side -->
  <aside class="absolute top-20 right-4 z-30 pointer-events-auto hidden md:flex flex-col gap-1.5 bg-slate-950/90 border border-slate-800/90 rounded-2xl p-2.5 backdrop-blur-xl shadow-2xl text-[11px]">
    <div class="font-bold text-slate-400 px-1 text-[10px] uppercase tracking-wider mb-0.5">Anneaux</div>
    <div class="p-1.5 rounded-xl bg-blue-600/20 border border-blue-500/40 text-blue-300 font-bold flex items-center justify-between gap-3">
      <span>1. &lt; 150 km</span>
      <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
    </div>
    <div class="p-1.5 rounded-xl bg-slate-900 text-slate-400 flex items-center justify-between gap-3">
      <span>2. 150 - 300 km</span>
      <span class="text-[10px] text-slate-600">○</span>
    </div>
    <div class="p-1.5 rounded-xl bg-slate-900 text-slate-400 flex items-center justify-between gap-3">
      <span>3. 300 - 450 km</span>
      <span class="text-[10px] text-slate-600">○</span>
    </div>
    <div class="p-1.5 rounded-xl bg-slate-900 text-slate-400 flex items-center justify-between gap-3">
      <span>4. 450 - 600 km</span>
      <span class="text-[10px] text-slate-600">○</span>
    </div>
    <div class="p-1.5 rounded-xl bg-slate-900 text-slate-400 flex items-center justify-between gap-3">
      <span>5. &gt; 600 km</span>
      <span class="text-[10px] text-slate-600">○</span>
    </div>
  </aside>

  <script>
    // Initialize Map with Realistic Concentric Rings around Paris
    const parisCoords = [48.8566, 2.3522];
    const map = L.map('map', { zoomControl: false }).setView(parisCoords, 7);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd',
    }).addTo(map);

    // Draw Concentric Rings
    const radii = [150000, 300000, 450000, 600000];
    const colors = ['#3b82f6', '#0ea5e9', '#06b6d4', '#14b8a6'];

    radii.forEach((r, idx) => {
      L.circle(parisCoords, {
        radius: r,
        color: colors[idx],
        weight: idx === 0 ? 3 : 1.5,
        opacity: idx === 0 ? 0.9 : 0.4,
        fillColor: colors[idx],
        fillOpacity: idx === 0 ? 0.08 : 0.03,
        dashArray: idx === 0 ? null : '6, 6'
      }).addTo(map);
    });

    // Center marker
    L.circleMarker(parisCoords, {
      radius: 6,
      color: '#ffffff',
      weight: 2,
      fillColor: '#3b82f6',
      fillOpacity: 1
    }).addTo(map);

    // Toggle between Variants A and B
    function setVariant(varNum) {
      const btn1 = document.getElementById('tab-var1');
      const btn2 = document.getElementById('tab-var2');
      const container1 = document.getElementById('var1-container');
      const container2 = document.getElementById('var2-container');

      if (varNum === 1) {
        btn1.className = 'px-3.5 py-1.5 rounded-xl bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30 transition-all flex items-center gap-1.5';
        btn2.className = 'px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all flex items-center gap-1.5';
        container1.classList.remove('hidden');
        container2.classList.add('hidden');
        container2.classList.remove('flex');
      } else {
        btn2.className = 'px-3.5 py-1.5 rounded-xl bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30 transition-all flex items-center gap-1.5';
        btn1.className = 'px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium transition-all flex items-center gap-1.5';
        container1.classList.add('hidden');
        container2.classList.remove('hidden');
        container2.classList.add('flex');
      }
    }

    // Mode Switcher handlers
    function setMode(mode) {
      const bDaily = document.getElementById('mode-daily');
      const bFree = document.getElementById('mode-free');
      const bCustom = document.getElementById('mode-custom');

      [bDaily, bFree, bCustom].forEach(b => {
        b.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all flex items-center gap-1 font-medium hover:bg-slate-800';
      });

      if (mode === 'daily') {
        bDaily.className = 'px-2.5 py-1 rounded-lg font-bold bg-blue-600 text-white shadow-sm transition-all flex items-center gap-1';
      } else if (mode === 'free') {
        bFree.className = 'px-2.5 py-1 rounded-lg font-bold bg-blue-600 text-white shadow-sm transition-all flex items-center gap-1';
      } else if (mode === 'custom') {
        bCustom.className = 'px-2.5 py-1 rounded-lg font-bold bg-purple-600 text-white shadow-sm transition-all flex items-center gap-1';
        alert("Ouvre le modal de customisation GeoRings (rayons, pas d'incrément, métrique...)");
      }
    }

    // VAR 1 Dropdown logic
    let v1Scale = { flag: '🇫🇷', name: 'France' };
    let v1Metric = { id: 'population', label: 'Villes' };

    function toggleVar1Dropdown() {
      document.getElementById('var1-menu').classList.toggle('hidden');
    }

    function updateVar1Label() {
      document.getElementById('var1-flag').textContent = v1Scale.flag;
      document.getElementById('var1-label').textContent = `${v1Scale.name} • ${v1Metric.label}`;
    }

    function pickVar1Scale(flag, name) {
      v1Scale = { flag, name };
      updateVar1Label();
      document.querySelectorAll('.v1-scale-opt').forEach(el => {
        el.className = 'v1-scale-opt w-full flex items-center justify-between p-2 rounded-xl bg-slate-950/40 border border-slate-800 text-left transition-all hover:bg-slate-800/60';
        el.querySelector('.check').classList.add('hidden');
      });
      event.currentTarget.className = 'v1-scale-opt w-full flex items-center justify-between p-2 rounded-xl bg-blue-600/15 border border-blue-500/40 text-left transition-all';
      event.currentTarget.querySelector('.check').classList.remove('hidden');
    }

    function pickVar1Metric(id, label, icon) {
      v1Metric = { id, label };
      updateVar1Label();

      const btnPop = document.getElementById('v1-metric-pop');
      const btnAir = document.getElementById('v1-metric-air');

      if (id === 'population') {
        btnPop.className = 'py-2 px-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-blue-600 border-blue-500 text-white shadow-sm';
        btnAir.className = 'py-2 px-2.5 rounded-xl border text-xs font-medium transition-all flex items-center justify-center gap-1.5 bg-slate-950/40 border-slate-800 text-slate-400 hover:text-slate-200';
      } else {
        btnAir.className = 'py-2 px-2.5 rounded-xl border text-xs font-bold transition-all flex items-center justify-center gap-1.5 bg-sky-600 border-sky-500 text-white shadow-sm';
        btnPop.className = 'py-2 px-2.5 rounded-xl border text-xs font-medium transition-all flex items-center justify-center gap-1.5 bg-slate-950/40 border-slate-800 text-slate-400 hover:text-slate-200';
      }

      setTimeout(() => {
        document.getElementById('var1-menu').classList.add('hidden');
      }, 150);
    }

    // VAR 2 Dropdown logic
    function toggleVar2Dropdown() {
      document.getElementById('var2-menu').classList.toggle('hidden');
    }

    function pickVar2Scale(flag, name) {
      document.getElementById('var2-flag').textContent = flag;
      document.getElementById('var2-label').textContent = name;
      document.getElementById('var2-menu').classList.add('hidden');
    }

    function setVar2Metric(metric) {
      const bPop = document.getElementById('var2-metric-pop');
      const bAir = document.getElementById('var2-metric-air');

      if (metric === 'pop') {
        bPop.className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold transition-all flex items-center gap-1 shadow-sm';
        bAir.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition-all flex items-center gap-1 hover:bg-slate-800';
      } else {
        bAir.className = 'px-2.5 py-1 rounded-lg bg-sky-600 text-white font-bold transition-all flex items-center gap-1 shadow-sm';
        bPop.className = 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white font-medium transition-all flex items-center gap-1 hover:bg-slate-800';
      }
    }

    // Close menus when clicking outside
    document.addEventListener('click', (e) => {
      const v1Container = document.getElementById('var1-container');
      const v1Menu = document.getElementById('var1-menu');
      if (v1Container && !v1Container.contains(e.target)) {
        v1Menu.classList.add('hidden');
      }

      const v2Container = document.getElementById('var2-scale-dropdown-container');
      const v2Menu = document.getElementById('var2-menu');
      if (v2Container && !v2Container.contains(e.target)) {
        v2Menu.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
